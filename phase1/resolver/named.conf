options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };

    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    allow-query-cache { any; };

    dnssec-validation no;
};

zone "." {
    type hint;
    file "/etc/bind/zones/db.root-hints";
};
